<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Invoice | InvoZap</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="createinvoice.css">
</head>
<body>
  <nav class="navbar">
    <h2>InvoZap</h2>
    <div><a href="index.html">Home</a><a class="active-link" href="createnew.html">Create</a><a href="recents.html">History</a><a href="analytics.html">Analyze</a></div>
  </nav>

  <main class="invoice-editor">
    <header class="editor-header">
      <div><a class="back-link" href="index.html">← Back</a>
        <h1>Create Invoice <span>INV-0001</span></h1><p>Fill in the details and preview your invoice.</p></div>
      <div class="editor-actions"><button type="button">Preview</button><button type="button" class="save-button">Save Invoice</button></div>
    </header>

    <div class="editor-layout">
      <form class="invoice-form">
        <section class="form-card">
          <div class="section-heading">
            <h2>Invoice Settings</h2><small>Primary details</small></div>
          <div class="form-grid three-columns"><label>Invoice Number
            <input type="text" value="INV-0001"></label>
            <label>Invoice Date<input type="date"></label>
            <label>Due Date<input type="date"></label></div>
          <div class="form-grid two-columns"><label>Currency<select><option>Indian Rupee (₹)</option></select></label>
            <label>Status<select><option>Unpaid</option><option>Paid</option></select></label></div>
        </section>

        <section class="form-card">
          <div class="section-heading"><h2>Client / Bill To Details</h2></div>
          <label>Client / Company Name<input type="text" placeholder="e.g. ABC Technologies"></label>
          <label>Billing Address<textarea placeholder="Address line, city, state, PIN code"></textarea></label>
          <div class="form-grid three-columns"><label>Email Address<input type="email" placeholder="client@example.com"></label><label>Phone Number<input type="tel" placeholder="+91 98765 00000"></label><label>GSTIN / PAN<input type="text" placeholder="Tax ID"></label></div>
        </section>
      </form>
    </div>
  </main>
</body>
</html>
